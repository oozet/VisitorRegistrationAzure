<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Visitor Registration Form</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <div class="form-container">
        <h2>Registration Form</h2>
        <form id="registration-form">
          <label for="firstname">Förnamn: </label>
          <input name="firstname" maxlength="100" />
          <label for="lastname">Efternamn: </label>
          <input name="lastname" maxlength="100" />
          <label for="email">E-Post: </label>
          <input name="email" type="email" maxlength="256" />
          <button type="submit">Registrera</button>
        </form>
      </div>

      <a href="testfunction.html">Test TestFunction</a>
      <p id="api-register-response"></p>
    </main>
    <script>
      const apiUrl = "api/";
      const formElement = document.getElementById("registration-form");
      formElement.addEventListener("submit", function (event) {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(formElement));

        fetch(apiUrl + "RegisterVisitor", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        })
          .then((res) => res.json())
          .then((resData) => {
            document.getElementById("api-register-response").textContent = resData;
          })
          .catch(console.error);
      });
    </script>
  </body>
</html>
